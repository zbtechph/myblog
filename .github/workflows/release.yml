name: Build and create Github Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag of the release to upload assets to (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Registry
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Package build output
        run: |
          zip -r package-build.zip dist/

      - name: Attach assets to github release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: tag_name: ${{ inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          files: |
            package-build.zip
